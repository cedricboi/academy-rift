# One-click deploy to Render (https://render.com) — free tier works.
# In Render: New + → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: academy-rift
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Question hub (/hub): the password for it, and a GitHub token so question
      # sets are kept for good (Render's free plan wipes saved files on restart).
      # See "Question hub" in README.md. Fill both in on Render's Environment page.
      - key: HUB_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
