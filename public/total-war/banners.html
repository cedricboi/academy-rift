<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Ten Standards — Academy Rift</title><link rel="stylesheet" href="../fonts/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;padding:35px;color:#e9d9b6;background:radial-gradient(ellipse at top,#2b3944,#0b1721);font:14px 'Rift Body',sans-serif;min-height:100vh}header{text-align:center}small{color:#b7a271;letter-spacing:3px}h1{font:32px Cinzel;margin:10px}p{color:#a7beb8}main{max-width:1150px;margin:30px auto;display:grid;grid-template-columns:repeat(5,1fr);gap:20px}article{text-align:center;border:1px solid #a9955e40;background:#0c192540;padding:15px 5px}img{width:100%;height:230px;object-fit:contain;filter:drop-shadow(0 9px 8px #0009)}h2{font:14px Cinzel;margin:10px 0 5px}article p{font-size:11px;margin:5px}a{display:inline-block;color:#d7bc7d;font-size:11px;padding:12px}footer{text-align:center}@media(max-width:700px){main{grid-template-columns:repeat(2,1fr)}}
</style><header><small>ACADEMY RIFT · TOTAL WAR</small><h1>The Ten Standards</h1><p>Original character portraits. Elemental crests. Colours worth carrying.</p></header><main id="collection"></main><footer><a href="./">Return to the battlefield</a></footer><script type="module">import {BANNERS} from './banners.js';document.querySelector('main').innerHTML=BANNERS.map(b=>`<article><img src="${b.src}" alt="${b.fullName} banner"><h2>${b.fullName}</h2><p>${b.element} / ${b.role}</p><a href="${b.src}" download="${b.id}-standard.svg">Download standard</a></article>`).join('');</script></html>
